# Unprivileged nginx: no `user` directive (that requires root),
# and pid/temp files live under /tmp so UID 1172 can write them.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    access_log /dev/stdout;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/plain text/css text/javascript application/javascript
                   application/json application/manifest+json image/svg+xml;

        # React Router owns the paths (/select, /brooke, ...), so every unknown
        # request has to fall through to the app shell.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Hashed build output never changes under the same name.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        location /img/ {
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # The shell names the hashed assets, so it must always be revalidated.
        # nginx drops inherited add_header directives as soon as a location sets
        # one of its own, so each block below repeats the headers it needs.
        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location = /manifest.json {
            add_header Cache-Control "no-cache";
        }

        location = /site.webmanifest {
            add_header Cache-Control "no-cache";
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
